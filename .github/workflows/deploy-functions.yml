name: BQ Sqwad AI — Firebase Backend Validation

on:
  workflow_dispatch:
    inputs:
      deploy_to_firebase:
        description: "Deploy legacy Firebase Functions/Firestore (requires Blaze billing)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firebase-backend-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: bqsqwadai
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      CLOUDFLARE_WORKER_URL: https://bq-sqwad-ai-app.isaacoshiomole0.workers.dev

    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install backend dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate backend JavaScript
        working-directory: functions
        run: npm run check

      - name: Run backend tests
        working-directory: functions
        run: npm test

      - name: Authenticate with Google service account
        if: ${{ inputs.deploy_to_firebase && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Deploy legacy Firebase backend
        if: ${{ inputs.deploy_to_firebase && env.FIREBASE_SERVICE_ACCOUNT_JSON != '' }}
        run: npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project "${FIREBASE_PROJECT_ID}" --non-interactive

      - name: Deploy legacy Firebase backend with token
        if: ${{ inputs.deploy_to_firebase && env.FIREBASE_SERVICE_ACCOUNT_JSON == '' && env.FIREBASE_TOKEN != '' }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@latest deploy --only functions,firestore:rules --project "${FIREBASE_PROJECT_ID}" --non-interactive --token "${FIREBASE_TOKEN}"

      - name: Verify migrated Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --max-time 20 "${CLOUDFLARE_WORKER_URL}/health")"
          echo "Cloudflare health response: $BODY"
          echo "$BODY" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'

      - name: Verify protected Worker route rejects missing auth
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/worker-ai-response.txt -w '%{http_code}' -X POST "${CLOUDFLARE_WORKER_URL}/ai" -H 'Content-Type: application/json' --data '{}')"
          echo "Cloudflare /ai unauthenticated status: $STATUS"
          cat /tmp/worker-ai-response.txt
          test "$STATUS" = "401"
          grep -Eq '"error"[[:space:]]*:[[:space:]]*"auth_required"' /tmp/worker-ai-response.txt

      - name: Report Firebase deployment status
        shell: bash
        run: |
          if [ "${{ inputs.deploy_to_firebase }}" = "true" ]; then
            echo "Legacy Firebase deployment was requested and completed."
          else
            echo "Legacy Firebase deployment skipped: BQ Sqwad AI is using the Cloudflare Worker migration path."
            echo "Firebase Functions remain in the repository and can be deployed later when the project is on Blaze."
          fi
