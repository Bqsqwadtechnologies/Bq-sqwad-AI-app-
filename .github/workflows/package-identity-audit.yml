name: Android Package Identity Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "app/google-services.json"
      - "app/src/**"
      - "settings.gradle.kts"
      - ".github/workflows/package-identity-audit.yml"

permissions:
  contents: read

jobs:
  package-identity-audit:
    name: Verify com.bqsqwad.ai across Android configuration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Audit Gradle, Firebase, manifest, and source package declarations
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import pathlib
          import re
          import sys
          import xml.etree.ElementTree as ET

          ROOT = pathlib.Path(".")
          EXPECTED = "com.bqsqwad.ai"
          errors = []
          checked = []

          def require(condition, message):
              if condition:
                  checked.append("PASS: " + message)
              else:
                  errors.append("FAIL: " + message)

          gradle_path = ROOT / "app/build.gradle.kts"
          gradle = gradle_path.read_text(encoding="utf-8")
          namespace_match = re.search(r'(?m)^\s*namespace\s*=\s*"([^"]+)"', gradle)
          app_id_match = re.search(r'(?m)^\s*applicationId\s*=\s*"([^"]+)"', gradle)
          require(namespace_match is not None and namespace_match.group(1) == EXPECTED,
                  f"Gradle namespace must be {EXPECTED}; found {namespace_match.group(1) if namespace_match else 'MISSING'}")
          require(app_id_match is not None and app_id_match.group(1) == EXPECTED,
                  f"Gradle applicationId must be {EXPECTED}; found {app_id_match.group(1) if app_id_match else 'MISSING'}")

          firebase_path = ROOT / "app/google-services.json"
          try:
              firebase = json.loads(firebase_path.read_text(encoding="utf-8"))
              clients = firebase.get("client", [])
              android_packages = [
                  client.get("client_info", {}).get("android_client_info", {}).get("package_name")
                  for client in clients
              ]
              require(bool(android_packages), "Firebase google-services.json contains at least one Android client")
              require(all(p == EXPECTED for p in android_packages),
                      f"Every Firebase Android client package must be {EXPECTED}; found {android_packages}")
          except Exception as exc:
              errors.append(f"FAIL: Could not parse {firebase_path}: {exc}")

          manifest_path = ROOT / "app/src/main/AndroidManifest.xml"
          try:
              manifest = ET.parse(manifest_path).getroot()
              declared = manifest.attrib.get("package")
              # Modern Android projects usually omit manifest package and take it from Gradle.
              require(declared is None or declared == EXPECTED,
                      f"Manifest package must be absent or {EXPECTED}; found {declared}")
          except Exception as exc:
              errors.append(f"FAIL: Could not parse {manifest_path}: {exc}")

          source_roots = [
              ROOT / "app/src/main/java",
              ROOT / "app/src/main/kotlin",
              ROOT / "app/src/test/java",
              ROOT / "app/src/test/kotlin",
              ROOT / "app/src/androidTest/java",
              ROOT / "app/src/androidTest/kotlin",
          ]
          source_count = 0
          for source_root in source_roots:
              if not source_root.exists():
                  continue
              for file in source_root.rglob("*"):
                  if not file.is_file() or file.suffix not in (".kt", ".java"):
                      continue
                  source_count += 1
                  try:
                      text = file.read_text(encoding="utf-8")
                  except Exception as exc:
                      errors.append(f"FAIL: Cannot read {file}: {exc}")
                      continue
                  match = re.search(r"(?m)^\s*package\s+([A-Za-z_][A-Za-z0-9_.]*)\s*;?\s*$", text)
                  if not match:
                      errors.append(f"FAIL: No recognizable package declaration in {file}")
                      continue
                  declared = match.group(1)
                  expected_path = ".".join(file.relative_to(source_root).parts[:-1])
                  require(declared == expected_path,
                          f"{file}: package declaration {declared!r} matches source directory {expected_path!r}")
          require(source_count > 0, "Android Kotlin/Java source files were found for package-path audit")

          print("\n".join(checked))
          if errors:
              print("\nPACKAGE IDENTITY AUDIT FAILED:")
              print("\n".join(errors))
              sys.exit(1)
          print(f"\nPACKAGE IDENTITY AUDIT PASSED: {EXPECTED}")
          PY

      - name: Compile and run Android unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Confirm generated APK application ID
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            ACTUAL="$(apkanalyzer manifest application-id "$APK")"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            ACTUAL="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK")"
          else
            echo "::error::apkanalyzer is unavailable; cannot verify application ID inside generated APK."
            exit 1
          fi
          echo "Generated APK application ID: $ACTUAL"
          test "$ACTUAL" = "com.bqsqwad.ai" || {
            echo "::error::APK application ID mismatch. Expected com.bqsqwad.ai, got $ACTUAL"
            exit 1
          }
