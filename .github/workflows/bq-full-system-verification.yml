name: BQ Full System Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bq-full-system-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Backend, billing, and cross-platform parity checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Android app and Cloudflare Worker
        uses: actions/checkout@v7
        with:
          repository: Bqsqwadtechnologies/Bq-sqwad-AI-app-
          ref: main
          path: android-app
          fetch-depth: 0

      - name: Validate website repository access token
        id: website_token_present
        env:
          BQ_WEBSITE_REPO_TOKEN: ${{ secrets.BQ_WEBSITE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BQ_WEBSITE_REPO_TOKEN}" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Website checks will be skipped because BQ_WEBSITE_REPO_TOKEN is not configured."
          fi

      - name: Validate website repository token permissions
        id: website_access
        if: steps.website_token_present.outputs.available == 'true'
        env:
          BQ_WEBSITE_REPO_TOKEN: ${{ secrets.BQ_WEBSITE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer ${BQ_WEBSITE_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Bqsqwadtechnologies/bqsqwadai-b3064406)"
          if [[ "$status" != "200" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Website checks skipped: BQ_WEBSITE_REPO_TOKEN returned HTTP $status. Configure a fine-grained token with Contents: Read-only access."
            rm -f "$response_file"
            exit 0
          fi
          rm -f "$response_file"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Website repository token has read access."

      - name: Checkout website
        if: steps.website_access.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: Bqsqwadtechnologies/bqsqwadai-b3064406
          ref: main
          path: website
          fetch-depth: 0
          token: ${{ secrets.BQ_WEBSITE_REPO_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Run Android unit tests and debug build
        working-directory: android-app
        run: gradle :app:testDebugUnitTest :app:assembleDebug

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify live provider orchestrator wiring and Business Studio placeholder removal
        env:
          WEBSITE_AVAILABLE: ${{ steps.website_access.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          worker="android-app/cloudflare-worker/src/index.js"
          orchestrator="android-app/cloudflare-worker/src/orchestrator-native.js"
          grep -Fq 'versionCode = 15' android-app/app/build.gradle.kts
          grep -Fq 'versionName = "1.0.15"' android-app/app/build.gradle.kts
          grep -Fq 'import { runWithFallback } from "./orchestrator-native.js";' "$worker"
          grep -Fq 'runWithFallback(' "$worker"
          grep -Fq 'fallbackEnabled: Boolean(fallbackPricing?.configured === true)' "$worker"
          grep -Fq 'callGemini' "$orchestrator"
          if [[ "$WEBSITE_AVAILABLE" != "true" ]]; then
            echo "::warning::Website checks skipped because the private website token is unavailable."
            exit 0
          fi
          studio="website/src/routes/business/studio.tsx"
          storage="website/src/components/business/BusinessStorageMeter.tsx"
          expiry="website/src/components/business/BusinessExpiryBanner.tsx"
          metrics="website/src/components/business/BusinessStudioMetrics.tsx"
          workspace_functions="website/src/lib/business-workspace.functions.ts"
          grep -Fq 'import { runWithFallback } from "./orchestrator-native.js";' "$worker"
          grep -Fq 'runWithFallback(' "$worker"
          grep -Fq 'fallbackEnabled: Boolean(fallbackPricing?.configured === true)' "$worker"
          grep -Fq 'callGemini' "$orchestrator"
          if grep -Eq '2_400_000_000|10_737_418_240|Date\.now\(\) \+ 12 \* 86400000' "$studio"; then
            echo "::error::Invented Business Studio storage or expiry values are still present."
            exit 1
          fi
          grep -Fq 'Live storage usage is unavailable' "$storage"
          grep -Fq 'Plan expiry information is unavailable' "$expiry"
          grep -Fq 'getBusinessStudioMetrics({ data: { idToken } })' "$metrics"
          grep -Fq 'business.getAccess(user.uid)' "$workspace_functions"
          grep -Fq 'vault.getBusinessStorage(user.uid)' "$workspace_functions"
          echo "Provider orchestrator is on the live AI paths; no fabricated Business Studio metrics remain."

      - name: Verify Worker JavaScript syntax
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t worker_files < <(find cloudflare-worker -type f -name '*.js' -not -path '*/node_modules/*' | sort)
          test "${#worker_files[@]}" -gt 0
          for file in "${worker_files[@]}"; do
            echo "Syntax check: $file"
            node --check "$file"
          done

      - name: Install Worker dependencies
        working-directory: android-app/cloudflare-worker
        run: npm install --no-audit --no-fund

      - name: Run Worker automated tests
        working-directory: android-app/cloudflare-worker
        run: npm test

      - name: Run Worker package syntax check
        working-directory: android-app/cloudflare-worker
        run: npm run check

      - name: Verify shared-credit and billing contract is present on both platforms
        if: steps.website_access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          worker="android-app/cloudflare-worker/src/index.js"
          website="website/src/lib/credits.server.ts"
          chat_route="website/src/routes/api/chat.ts"
          test -s "$worker"
          test -s "$website"
          test -s "$chat_route"

          # Guard against accidentally reintroducing trial-credit grants.
          if grep -R -n -E 'applyConfiguredCreditTrial|grantTrialCredits' android-app/cloudflare-worker/src; then
            echo "Legacy trial-credit grant path detected."
            exit 1
          fi

          # Confirm server-side token settlement/refund logic exists in the Worker.
          for symbol in resolveTokenPricing estimateTokenReservation settleCreditReservation reverseCredits recordTokenUsage; do
            grep -q "$symbol" "$worker" || { echo "Missing Worker billing contract: $symbol"; exit 1; }
          done

          # Confirm website uses reservation + actual-usage settlement/release paths.
          for symbol in reserveChatCredits settleChatReservation releaseChatReservation; do
            grep -R -q "$symbol" website/src/lib website/src/routes || { echo "Missing website credit contract: $symbol"; exit 1; }
          done

          # Confirm both implementations reference the same authoritative Firebase user balance document.
          grep -q 'FIRESTORE_BASE' android-app/cloudflare-worker/src/firebase.js
          grep -R -q 'users' website/src/lib/credits.server.ts

          echo "Static contract checks passed. These checks prove code paths exist, not that a live authenticated transaction succeeded."

      - name: Check recent integration history
        if: steps.website_access.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Recent Android/Worker commits:"
          git -C android-app log -n 20 --date=iso-strict --pretty=format:'%h %ad %s'
          echo
          echo "Recent website commits:"
          git -C website log -n 20 --date=iso-strict --pretty=format:'%h %ad %s'
          echo

      - name: Install website dependencies
        if: steps.website_access.outputs.available == 'true'
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Run website test suite
        if: steps.website_access.outputs.available == 'true'
        working-directory: website
        run: npm test

      - name: Run website lint
        if: steps.website_access.outputs.available == 'true'
        working-directory: website
        run: npm run lint

      - name: Run website billing regression tests
        if: steps.website_access.outputs.available == 'true'
        working-directory: website
        run: npx vitest run src/lib/usage-billing.test.ts

      - name: Verify Google Play checkout handoff is wired
        if: steps.website_access.outputs.available == 'true'
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          billing="app/src/main/java/com/bqsqwad/ai/core/PlayBillingClient.kt"
          test -s "$billing"
          grep -Fq 'fun launchPurchase(productId: String, basePlanId: String?, offerId: String? = null)' "$billing"
          grep -Fq 'client.launchBillingFlow(activity, flow)' "$billing"
          grep -Fq 'BillingClient.BillingResponseCode.OK' "$billing"
          grep -Fq 'billing_product_details_missing' "$billing"
          grep -Fq 'billing_subscription_offer_mismatch' "$billing"
          grep -Fq 'verifyWithBackend(purchase)' "$billing"
          echo "Google Play checkout handoff, product/offer validation, launch response handling, and server verification hooks are present."
          echo "This is a source-level regression check. A real Play checkout screen still requires a Play-installed build and a licensed tester account."

      - name: Build website
        if: steps.website_access.outputs.available == 'true'
        working-directory: website
        run: npm run build

      - name: Check production Worker reachability
        env:
          WORKER_URL: https://bq-sqwad-ai-app.isaacoshiomole0.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output worker-response.txt --write-out '%{http_code}' --max-time 20 "$WORKER_URL/")"
          echo "Worker root HTTP status: $code"
          head -c 1000 worker-response.txt || true
          echo
          case "$code" in
            2*|3*|4*) ;;
            *) echo "Worker returned an unexpected server status"; exit 1 ;;
          esac

      - name: Report live-test limitations
        if: always()
        shell: bash
        run: |
          echo "This workflow performs backend source checks, website lint/build, recent-commit inspection, and Worker reachability."
          echo "Authenticated credit spend/refund, Play payment verification, cross-device chat-history sync, and Live Voice/Camera require dedicated test credentials/devices and are not claimed as passed by static checks."
          echo "No APK/AAB is built, uploaded, or published by this workflow."
