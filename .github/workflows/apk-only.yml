name: BQ Sqwad AI — APK Only

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bq-sqwad-ai-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-signed-apk:
    name: Build and verify one installable release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Gradle and cache
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Validate release-signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 secret is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::KEYSTORE_PASSWORD secret is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS secret is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build signed release APK (fail on Gradle warnings)
        run: gradle --no-daemon --warning-mode=fail :app:assembleRelease

      - name: Verify APK count, signature, and application ID
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          mapfile -t APKS < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print)
          test "${#APKS[@]}" -eq 1 || { echo "::error::Expected exactly one release APK, found ${#APKS[@]}"; exit 1; }
          APK="${APKS[0]}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner" || { echo "::error::apksigner was not found"; exit 1; }
          test -x "$BUILD_TOOLS/aapt" || { echo "::error::aapt was not found"; exit 1; }
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.bqsqwad.ai'"
          test -s "$APK"
          echo "Verified signed APK: $APK"
          sha256sum "$APK"

      - name: Upload the single verified APK
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Installable-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
