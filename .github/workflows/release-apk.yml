name: BQ Sqwad AI — Signed Release APK and AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build Signed Release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Release Keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Build Signed Release APK and AAB
        run: gradle :app:assembleRelease :app:bundleRelease

      - name: Verify APK and AAB Outputs and Signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"

          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "$HOME/.android" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          # Android App Bundles use JAR signing; fail the release if signature verification fails.
          jarsigner -verify -verbose -certs "$AAB" > /tmp/aab-signature-verification.txt 2>&1
          grep -qi "jar verified" /tmp/aab-signature-verification.txt
          tail -n 20 /tmp/aab-signature-verification.txt

          # Both outputs must be valid ZIP containers before upload.
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Signed-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
