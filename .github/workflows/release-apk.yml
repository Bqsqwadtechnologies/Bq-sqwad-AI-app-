name: BQ Sqwad AI — Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Release Keystore
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build Release APK
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
