name: Deploy Cloudflare Worker (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Choose DEPLOY only when you want to publish the Worker to production"
        required: true
        type: choice
        options:
          - CANCEL
          - DEPLOY
        default: CANCEL

permissions:
  contents: read

concurrency:
  group: bq-sqwad-cloudflare-production
  cancel-in-progress: false

jobs:
  test:
    name: Worker syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  deploy:
    name: Validate and deploy Worker to production
    needs: test
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Validate Wrangler configuration and build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUILD_ID="${GITHUB_SHA:0:12}"
          npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc --var "BQ_BUILD_ID:$BUILD_ID"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUILD_ID="${GITHUB_SHA:0:12}"
          npx --yes wrangler@4 deploy --config wrangler.jsonc --var "BQ_BUILD_ID:$BUILD_ID"

      - name: Smoke-test deployed health endpoint
        run: |
          BUILD_ID="${GITHUB_SHA:0:12}"
          HEALTH_URL="https://bq-sqwad-ai-app.isaacoshiomole0.workers.dev/health"
          for attempt in $(seq 1 12); do
            BODY="$(curl --silent --show-error --fail "$HEALTH_URL" || true)"
            if [ -n "$BODY" ] && echo "$BODY" | jq -e --arg build "$BUILD_ID" '.status == "ok" and .buildId == $build' >/dev/null; then
              echo "Worker health is OK at build $BUILD_ID"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployed Worker health did not report expected build ID $BUILD_ID"
          echo "Last health response: ${BODY:-<no response>}"
          exit 1
