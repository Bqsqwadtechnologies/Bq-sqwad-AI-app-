name: Deploy Cloudflare Worker (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to deploy the Worker to production"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Worker syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

  deploy:
    name: Deploy Worker to production
    needs: test
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Record build id
        run: echo "BQ_BUILD_ID=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Deploy with wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.jsonc --var BQ_BUILD_ID:${{ env.BQ_BUILD_ID }}
