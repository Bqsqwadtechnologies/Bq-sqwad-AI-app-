name: BQ Sqwad AI — Fast CI

on:
  push:
    branches: [main]
    paths-ignore: ["preview/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["preview/**", "docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Backend + Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Functions
        working-directory: functions
        run: npm install --no-audit --no-fund && npm run check && npm test
      - name: Worker
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund && npm run check && npm test

  android:
    name: Android compile + tests + debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools build-tools;36.0.0"
      - name: Install Android API 37
        run: |
          set -euo pipefail
          sdkmanager --channel=1 "platforms;android-37"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic
      - name: Test and assemble
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
