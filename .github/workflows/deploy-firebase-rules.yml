name: Deploy Firebase Storage rules (manual fallback)

on:
  push:
    branches: [main]
    paths:
      - 'firebase.json'
      - 'storage.rules'
      - '.github/workflows/deploy-firebase-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-storage-rules-bqsqwadai
  cancel-in-progress: false

jobs:
  deploy-storage-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Validate Firebase service account secret
        id: firebase_auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Firebase Storage deployment skipped because FIREBASE_SERVICE_ACCOUNT is not configured."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const x=require(process.argv[1]); if(!x.project_id || !x.client_email || !x.private_key) process.exit(1)" "$RUNNER_TEMP/firebase-service-account.json"
          test "$(node -p "require('$RUNNER_TEMP/firebase-service-account.json').project_id")" = "bqsqwadai" || { echo "::error::Service account must belong to Firebase project bqsqwadai"; exit 1; }
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Firebase Storage rules only
        if: steps.firebase_auth.outputs.available == 'true'
        run: npx firebase-tools deploy --only storage --project bqsqwadai --non-interactive
