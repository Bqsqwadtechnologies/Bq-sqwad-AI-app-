name: BQ Sqwad AI — Amazon Appstore Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-appstore-release
  cancel-in-progress: false

jobs:
  amazon-release:
    name: Build and verify Amazon APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Restore Amazon Appstore authentication public key
        shell: bash
        env:
          AMAZON_APPSTORE_PUBLIC_KEY_BASE64: ${{ secrets.AMAZON_APPSTORE_PUBLIC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$AMAZON_APPSTORE_PUBLIC_KEY_BASE64"
          mkdir -p app/src/amazon/assets
          printf '%s' "$AMAZON_APPSTORE_PUBLIC_KEY_BASE64" | base64 --decode > app/src/amazon/assets/AppstoreAuthenticationKey.pem
          grep -q "BEGIN PUBLIC KEY" app/src/amazon/assets/AppstoreAuthenticationKey.pem
          chmod 644 app/src/amazon/assets/AppstoreAuthenticationKey.pem

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Amazon signed APK and AAB
        run: gradle :app:assembleAmazon :app:bundleAmazon

      - name: Verify Amazon package identity, outputs and signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/amazon/app-amazon.apk"
          AAB="app/build/outputs/bundle/amazon/app-amazon.aab"
          test -s "$APK"
          test -s "$AAB"

          AAPT="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1)"
          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.bqsqwad.ai'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          jarsigner -verify -verbose -certs "$AAB" > /tmp/amazon-aab-signature.txt 2>&1
          grep -qi "jar verified" /tmp/amazon-aab-signature.txt
          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null

          # Confirm the Amazon-only build embeds its distribution marker and public key.
          unzip -p "$APK" assets/AppstoreAuthenticationKey.pem | grep -q "BEGIN PUBLIC KEY"
          echo "Amazon artifact verification passed for com.bqsqwad.ai"

      - name: Upload Amazon signed APK
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Amazon-Signed-APK
          path: app/build/outputs/apk/amazon/app-amazon.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Amazon signed AAB
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Amazon-Signed-AAB
          path: app/build/outputs/bundle/amazon/app-amazon.aab
          if-no-files-found: error
          retention-days: 14
