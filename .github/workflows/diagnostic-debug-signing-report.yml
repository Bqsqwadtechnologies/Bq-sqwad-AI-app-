name: Diagnostic - Android Debug Signing Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-signing-report:
    name: Report debug signing certificate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5'

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Android Gradle project found at repository root."

      - name: Generate debug signing report
        shell: bash
        run: |
          set -euo pipefail

          report="$(gradle --no-daemon signingReport 2>&1)"

          printf '%s
' "$report" |
            awk '
              /Variant: debug/ {
                in_debug=1
                next
              }

              in_debug && /Variant:/ {
                in_debug=0
              }

              in_debug && /SHA1:/ {
                print
                found=1
              }

              END {
                if (!found) {
                  print "DEBUG_SHA1_NOT_FOUND"
                  exit 1
                }
              }
            '
