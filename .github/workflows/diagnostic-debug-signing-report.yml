name: Diagnostic - Android Debug Signing Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-signing-report:
    name: Report debug signing certificate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Find Gradle project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW_PATH="$(find . -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi

          GRADLE_DIR="$(dirname "$GRADLEW_PATH")"

          echo "Gradle project found at: $GRADLE_DIR"
          echo "GRADLE_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Generate debug signing report
        shell: bash
        run: |
          set -euo pipefail

          cd "$GRADLE_DIR"
          chmod +x ./gradlew

          report="$(./gradlew signingReport 2>&1)"

          printf '%s
' "$report" |
            awk '
              /Variant: debug/ {
                in_debug=1
                next
              }

              in_debug && /Variant:/ {
                in_debug=0
              }

              in_debug && /SHA1:/ {
                print
                found=1
              }

              END {
                if (!found) {
                  print "DEBUG_SHA1_NOT_FOUND"
                  exit 1
                }
              }
            '
