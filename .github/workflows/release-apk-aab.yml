name: BQ Sqwad AI — Manual Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bq-sqwad-ai-release-main
  cancel-in-progress: true

jobs:
  release:
    name: Audit, Diagnose, Build & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify repository and branch
        id: repo_check
        shell: bash
        continue-on-error: true
        run: |
          set +e
          status=0

          actual_repo="$(git config --get remote.origin.url)"
          actual_branch="${GITHUB_REF_NAME:-}"
          head_sha="$(git rev-parse HEAD 2>/dev/null)"
          expected_sha="${GITHUB_SHA:-}"

          echo "Repository: $actual_repo"
          echo "Workflow ref: $actual_branch"
          echo "HEAD: $head_sha"

          [[ "$actual_repo" == *"Bqsqwadtechnologies/Bq-sqwad-AI-app-"* ]] || status=1
          [[ "$actual_branch" == "main" ]] || status=1
          [[ -n "$head_sha" && "$head_sha" == "$expected_sha" ]] || status=1

          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Set up JDK 17
        id: setup_jdk
        continue-on-error: true
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        id: android_tools
        continue-on-error: true
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools build-tools;36.0.0"

      - name: Install Android API 37
        id: android_sdk
        shell: bash
        continue-on-error: true
        run: |
          set +e
          sdkmanager --channel=3 "platforms;android-37"
          install_status=$?
          if [[ $install_status -eq 0 && -f "$ANDROID_HOME/platforms/android-37/android.jar" ]]; then
            status=PASS
          else
            status=FAIL
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Select Gradle launcher
        id: gradle_source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "./gradlew" && -f "gradle/wrapper/gradle-wrapper.properties" ]]; then
            echo "launcher=./gradlew" >> "$GITHUB_OUTPUT"
            echo "wrapper=true" >> "$GITHUB_OUTPUT"
            echo "Gradle source: repository wrapper"
          else
            echo "launcher=gradle" >> "$GITHUB_OUTPUT"
            echo "wrapper=false" >> "$GITHUB_OUTPUT"
            echo "Gradle source: setup-gradle installed distribution"
          fi

      - name: Set up Gradle
        id: setup_gradle
        continue-on-error: true
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ steps.gradle_source.outputs.wrapper == 'true' && 'wrapper' || '9.5.0' }}
          cache-provider: basic

      - name: Project audit
        id: project_audit
        shell: bash
        continue-on-error: true
        env:
          GRADLE_LAUNCHER: ${{ steps.gradle_source.outputs.launcher }}
        run: |
          set +e
          mkdir -p build-logs
          status=0

          {
            echo "=== BQ Sqwad AI project audit ==="
            echo "Repository: Bqsqwadtechnologies/Bq-sqwad-AI-app-"
            echo "Branch: main"
            echo "Gradle root: $(pwd)"
            echo "Application module: :app"
            echo "Gradle launcher: $GRADLE_LAUNCHER"
            echo
            echo "--- Toolchain ---"
            java -version
            "$GRADLE_LAUNCHER" --version
            echo
            echo "--- settings.gradle.kts ---"
            grep -E 'rootProject.name|include\(' settings.gradle.kts
            echo
            echo "--- root build.gradle.kts ---"
            grep -E 'com.android.application|kotlin.plugin.compose|google-services' build.gradle.kts
            echo
            echo "--- app/build.gradle.kts ---"
            grep -E 'namespace =|compileSdk|minSdk|targetSdk|applicationId|versionCode|versionName|isMinifyEnabled|isShrinkResources|sourceCompatibility|targetCompatibility' app/build.gradle.kts
            echo
            echo "--- Build types / signing ---"
            grep -nE 'buildTypes|release \{|signingConfig|KEYSTORE_PATH|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD' app/build.gradle.kts
            echo
            echo "--- Gradle wrapper ---"
            if [[ -f gradle/wrapper/gradle-wrapper.properties ]]; then
              cat gradle/wrapper/gradle-wrapper.properties
            else
              echo "No Gradle wrapper is present in this repository."
            fi
            echo
            echo "--- Firebase / Google services ---"
            test -f app/google-services.json
            echo "app/google-services.json: present"
            grep -E '"project_id"|"package_name"' app/google-services.json
            echo
            echo "--- Android manifest identifiers ---"
            grep -E 'package|android:label|android:name="\.MainActivity"' app/src/main/AndroidManifest.xml
            echo
            echo "--- Source/build configuration ---"
            test -f gradle.properties
            test -f app/proguard-rules.pro
          } 2>&1 | tee build-logs/project-audit.log

          [[ ${PIPESTATUS[0]} -eq 0 ]] || status=1
          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gradle configuration and task discovery
        id: task_discovery
        shell: bash
        continue-on-error: true
        env:
          GRADLE_LAUNCHER: ${{ steps.gradle_source.outputs.launcher }}
        run: |
          set +e
          mkdir -p build-logs
          status=0

          "$GRADLE_LAUNCHER" --no-daemon --stacktrace help 2>&1 | tee build-logs/gradle-help.log
          help_status=${PIPESTATUS[0]}

          "$GRADLE_LAUNCHER" --no-daemon --stacktrace :app:tasks --all 2>&1 | tee build-logs/gradle-tasks.log
          tasks_status=${PIPESTATUS[0]}

          {
            echo
            echo "=== Required task presence ==="
            for task in testDebugUnitTest lintDebug lint assembleDebug assembleRelease bundleRelease; do
              if grep -Eq "^[[:space:]]*$task([[:space:]]|$)" build-logs/gradle-tasks.log; then
                echo "FOUND: :app:$task"
              else
                echo "MISSING: :app:$task"
              fi
            done
          } | tee -a build-logs/gradle-tasks.log

          [[ $help_status -eq 0 && $tasks_status -eq 0 ]] || status=1
          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Restore release signing key
        id: signing_restore
        shell: bash
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          status=0

          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "FAIL: required secret KEYSTORE_BASE64 is missing."
            status=1
          else
            mkdir -p "$(dirname "$KEYSTORE_PATH")"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            decode_status=$?
            if [[ $decode_status -ne 0 || ! -s "$KEYSTORE_PATH" ]]; then
              echo "FAIL: KEYSTORE_BASE64 could not be restored to a non-empty keystore file."
              status=1
            else
              chmod 600 "$KEYSTORE_PATH"
              echo "Release keystore restored."
            fi
          fi

          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate release signing configuration
        id: signing_validation
        shell: bash
        continue-on-error: true
        run: |
          set +e
          status=0

          [[ -s "$KEYSTORE_PATH" ]] || status=1
          [[ -n "$KEYSTORE_PASSWORD" ]] || status=1
          [[ -n "$KEY_ALIAS" ]] || status=1
          [[ -n "$KEY_PASSWORD" ]] || status=1

          if [[ $status -eq 0 ]]; then
            keytool -list               -keystore "$KEYSTORE_PATH"               -storepass "$KEYSTORE_PASSWORD"               -alias "$KEY_ALIAS"               >/dev/null 2>&1
            [[ $? -eq 0 ]] || status=1
          fi

          if [[ $status -eq 0 ]]; then
            echo "Release signing configuration: PASS"
          else
            echo "Release signing configuration: FAIL"
            echo "Required configuration: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
          fi

          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run JVM unit tests
        id: unit_tests
        shell: bash
        continue-on-error: true
        env:
          GRADLE_LAUNCHER: ${{ steps.gradle_source.outputs.launcher }}
        run: |
          set +e
          mkdir -p build-logs
          "$GRADLE_LAUNCHER" --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee build-logs/unit-tests.log
          status=${PIPESTATUS[0]}
          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run Android lint
        id: lint
        shell: bash
        continue-on-error: true
        env:
          GRADLE_LAUNCHER: ${{ steps.gradle_source.outputs.launcher }}
        run: |
          set +e
          mkdir -p build-logs
          task=":app:lint"
          if ! grep -Eq "^[[:space:]]*lint([[:space:]]|$)" build-logs/gradle-tasks.log 2>/dev/null; then
            if grep -Eq "^[[:space:]]*lintDebug([[:space:]]|$)" build-logs/gradle-tasks.log 2>/dev/null; then
              task=":app:lintDebug"
            else
              echo "No discovered lint task was available."
              echo "status=FAIL" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          "$GRADLE_LAUNCHER" --no-daemon --stacktrace "$task" 2>&1 | tee build-logs/lint.log
          status=${PIPESTATUS[0]}
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build debug APK
        id: debug_build
        shell: bash
        continue-on-error: true
        env:
          GRADLE_LAUNCHER: ${{ steps.gradle_source.outputs.launcher }}
        run: |
          set +e
          mkdir -p build-logs
          "$GRADLE_LAUNCHER" --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build-logs/debug-apk.log
          build_status=${PIPESTATUS[0]}
          apk="app/build/outputs/apk/debug/app-debug.apk"
          if [[ $build_status -eq 0 && -s "$apk" ]]; then
            status=PASS
          else
            status=FAIL
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build release APK
        id: release_apk_build
        shell: bash
        continue-on-error: true
        env:
          GRADLE_LAUNCHER: ${{ steps.gradle_source.outputs.launcher }}
        run: |
          set +e
          mkdir -p build-logs
          "$GRADLE_LAUNCHER" --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee build-logs/release-apk.log
          build_status=${PIPESTATUS[0]}
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ $build_status -eq 0 && -s "$apk" ]]; then
            status=PASS
          else
            status=FAIL
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build release AAB
        id: release_aab_build
        shell: bash
        continue-on-error: true
        env:
          GRADLE_LAUNCHER: ${{ steps.gradle_source.outputs.launcher }}
        run: |
          set +e
          mkdir -p build-logs
          "$GRADLE_LAUNCHER" --no-daemon --stacktrace :app:bundleRelease 2>&1 | tee build-logs/release-aab.log
          build_status=${PIPESTATUS[0]}
          aab="app/build/outputs/bundle/release/app-release.aab"
          if [[ $build_status -eq 0 && -s "$aab" ]]; then
            status=PASS
          else
            status=FAIL
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "path=$aab" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate build artifacts and signatures
        id: artifact_validation
        if: ${{ always() }}
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p build-logs
          status=0

          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          release_aab="app/build/outputs/bundle/release/app-release.aab"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          debug_exists=false
          release_exists=false
          aab_exists=false
          release_apk_signature=FAIL
          aab_signature=FAIL

          [[ -s "$debug_apk" ]] && debug_exists=true || status=1
          [[ -s "$release_apk" ]] && release_exists=true || status=1
          [[ -s "$release_aab" ]] && aab_exists=true || status=1

          if [[ "$debug_exists" == true && -x "$apksigner" ]]; then
            "$apksigner" verify --verbose "$debug_apk" > build-logs/debug-apk-signature.log 2>&1
            [[ $? -eq 0 ]] || status=1
          else
            status=1
          fi

          if [[ "$release_exists" == true && -x "$apksigner" ]]; then
            "$apksigner" verify --verbose "$release_apk" > build-logs/release-apk-signature.log 2>&1
            if [[ $? -eq 0 ]]; then
              release_apk_signature=PASS
            else
              status=1
            fi
          else
            status=1
          fi

          if [[ "$aab_exists" == true ]]; then
            jarsigner -verify "$release_aab" > build-logs/release-aab-signature.log 2>&1
            if [[ $? -eq 0 ]]; then
              aab_signature=PASS
            else
              status=1
            fi
          else
            status=1
          fi

          echo "debug_exists=$debug_exists" >> "$GITHUB_OUTPUT"
          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "aab_exists=$aab_exists" >> "$GITHUB_OUTPUT"
          echo "release_apk_signature=$release_apk_signature" >> "$GITHUB_OUTPUT"
          echo "aab_signature=$aab_signature" >> "$GITHUB_OUTPUT"
          echo "status=$([[ $status -eq 0 ]] && echo PASS || echo FAIL)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload debug APK
        if: ${{ always() && steps.artifact_validation.outputs.debug_exists == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: BQ Sqwad AI Debug APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: ${{ always() && steps.artifact_validation.outputs.release_exists == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: BQ Sqwad AI Release APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        if: ${{ always() && steps.artifact_validation.outputs.aab_exists == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: BQ Sqwad AI Release AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: BQ Sqwad AI Diagnostic Logs
          path: build-logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Final diagnostic summary
        id: summary
        if: ${{ always() }}
        shell: bash
        env:
          JDK_SETUP: ${{ steps.setup_jdk.outcome }}
          ANDROID_TOOLS: ${{ steps.android_tools.outcome }}
          GRADLE_SETUP: ${{ steps.setup_gradle.outcome }}
          REPO_CHECK: ${{ steps.repo_check.outputs.status }}
          ANDROID_SDK: ${{ steps.android_sdk.outputs.status }}
          PROJECT_AUDIT: ${{ steps.project_audit.outputs.status }}
          TASK_DISCOVERY: ${{ steps.task_discovery.outputs.status }}
          SIGNING_RESTORE: ${{ steps.signing_restore.outputs.status }}
          SIGNING_VALIDATION: ${{ steps.signing_validation.outputs.status }}
          UNIT_TESTS: ${{ steps.unit_tests.outputs.status }}
          LINT: ${{ steps.lint.outputs.status }}
          DEBUG_BUILD: ${{ steps.debug_build.outputs.status }}
          RELEASE_APK: ${{ steps.release_apk_build.outputs.status }}
          RELEASE_AAB: ${{ steps.release_aab_build.outputs.status }}
          ARTIFACT_VALIDATION: ${{ steps.artifact_validation.outputs.status }}
          RELEASE_APK_SIGNATURE: ${{ steps.artifact_validation.outputs.release_apk_signature }}
          AAB_SIGNATURE: ${{ steps.artifact_validation.outputs.aab_signature }}
        run: |
          {
            echo "## BQ Sqwad AI — Release Pipeline Summary"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            printf '| JDK setup | %s |\n' "${JDK_SETUP:-failure}"
            printf '| Android SDK tools setup | %s |\n' "${ANDROID_TOOLS:-failure}"
            printf '| Gradle setup | %s |\n' "${GRADLE_SETUP:-failure}"
            printf '| Repository/branch | %s |\n' "${REPO_CHECK:-FAIL}"
            printf '| Android SDK API 37 | %s |\n' "${ANDROID_SDK:-FAIL}"
            printf '| Project inspection | %s |\n' "${PROJECT_AUDIT:-FAIL}"
            printf '| Gradle/task discovery | %s |\n' "${TASK_DISCOVERY:-FAIL}"
            printf '| Signing restore | %s |\n' "${SIGNING_RESTORE:-FAIL}"
            printf '| Signing configuration | %s |\n' "${SIGNING_VALIDATION:-FAIL}"
            printf '| JVM unit tests | %s |\n' "${UNIT_TESTS:-FAIL}"
            printf '| Android lint | %s |\n' "${LINT:-FAIL}"
            printf '| Debug APK | %s |\n' "${DEBUG_BUILD:-FAIL}"
            printf '| Release APK | %s |\n' "${RELEASE_APK:-FAIL}"
            printf '| Release AAB | %s |\n' "${RELEASE_AAB:-FAIL}"
            printf '| Artifact validation | %s |\n' "${ARTIFACT_VALIDATION:-FAIL}"
            printf '| Release APK signature | %s |\n' "${RELEASE_APK_SIGNATURE:-FAIL}"
            printf '| Release AAB signature | %s |\n' "${AAB_SIGNATURE:-FAIL}"
            echo
            echo "Artifacts are uploaded only when their corresponding files exist."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: FINAL GATE — fail unless release pipeline is healthy
        if: ${{ always() }}
        shell: bash
        env:
          REPO_CHECK: ${{ steps.repo_check.outputs.status }}
          ANDROID_SDK: ${{ steps.android_sdk.outputs.status }}
          PROJECT_AUDIT: ${{ steps.project_audit.outputs.status }}
          TASK_DISCOVERY: ${{ steps.task_discovery.outputs.status }}
          SIGNING_RESTORE: ${{ steps.signing_restore.outputs.status }}
          SIGNING_VALIDATION: ${{ steps.signing_validation.outputs.status }}
          UNIT_TESTS: ${{ steps.unit_tests.outputs.status }}
          LINT: ${{ steps.lint.outputs.status }}
          DEBUG_BUILD: ${{ steps.debug_build.outputs.status }}
          RELEASE_APK: ${{ steps.release_apk_build.outputs.status }}
          RELEASE_AAB: ${{ steps.release_aab_build.outputs.status }}
          ARTIFACT_VALIDATION: ${{ steps.artifact_validation.outputs.status }}
          RELEASE_APK_SIGNATURE: ${{ steps.artifact_validation.outputs.release_apk_signature }}
          AAB_SIGNATURE: ${{ steps.artifact_validation.outputs.aab_signature }}
        run: |
          set -euo pipefail

          failures=()

          check() {
            local name="$1"
            local value="${2:-FAIL}"
            if [[ "$value" != "PASS" ]]; then
              failures+=( "$name=${value}" )
            fi
          }

          check "JDK setup" "$JDK_SETUP"
          check "Android SDK tools setup" "$ANDROID_TOOLS"
          check "Gradle setup" "$GRADLE_SETUP"
          check "repository/branch" "$REPO_CHECK"
          check "Android SDK" "$ANDROID_SDK"
          check "project audit" "$PROJECT_AUDIT"
          check "Gradle/task discovery" "$TASK_DISCOVERY"
          check "signing restore" "$SIGNING_RESTORE"
          check "signing validation" "$SIGNING_VALIDATION"
          check "unit tests" "$UNIT_TESTS"
          check "lint" "$LINT"
          check "debug APK" "$DEBUG_BUILD"
          check "release APK" "$RELEASE_APK"
          check "release AAB" "$RELEASE_AAB"
          check "artifact validation" "$ARTIFACT_VALIDATION"
          check "release APK signature" "$RELEASE_APK_SIGNATURE"
          check "release AAB signature" "$AAB_SIGNATURE"

          if (( ${#failures[@]} > 0 )); then
            echo "FINAL RESULT: FAIL"
            echo "Required stages failed:"
            printf ' - %s\n' "${failures[@]}"
            exit 1
          fi

          echo "FINAL RESULT: PASS"
          echo "BQ Sqwad AI debug APK, release APK, and release AAB passed the required checks and validation."
