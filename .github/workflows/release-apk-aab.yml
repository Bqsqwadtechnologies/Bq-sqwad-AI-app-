name: BQ Sqwad AI — Release APK & AAB

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Git tag to publish when release publishing is enabled"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: bq-sqwad-release-main
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f build.gradle.kts
          command -v gradle
          gradle --version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36.0.0"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build release APK and AAB
        shell: bash
        run: |
          set +e

          mkdir -p build-logs

          echo "=== Building release APK ==="
          gradle --no-daemon --stacktrace clean assembleRelease 2>&1 | tee build-logs/release-apk.log
          apk_status=${PIPESTATUS[0]}
          echo "APK build exit code: $apk_status"

          echo "=== Building release AAB ==="
          gradle --no-daemon --stacktrace bundleRelease 2>&1 | tee build-logs/release-aab.log
          aab_status=${PIPESTATUS[0]}
          echo "AAB build exit code: $aab_status"

          echo "=== Release build summary ==="
          echo "APK: $apk_status"
          echo "AAB: $aab_status"

          if [ "$apk_status" -ne 0 ] || [ "$aab_status" -ne 0 ]; then
            echo "One or more release builds failed. Both build attempts were allowed to finish so all available errors are visible in this job log."
            exit 1
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: BQ-Sqwad-AI-v1.0.5-build-logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"

      - name: Record build identifier
        shell: bash
        run: |
          set -euo pipefail
          printf 'commit=%s\nshort_sha=%s\nversion=1.0.5\n' "$GITHUB_SHA" "${GITHUB_SHA:0:7}" > build-info.txt

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/BQ-Sqwad-AI-v1.0.5-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release/BQ-Sqwad-AI-v1.0.5-release.aab
          cp build-info.txt release/BUILD-INFO.txt
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload APK and AAB
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: BQ-Sqwad-AI-v1.0.5-release
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: BQ Sqwad AI v1.0.5
          generate_release_notes: true
          files: |
            release/BQ-Sqwad-AI-v1.0.5-release.apk
            release/BQ-Sqwad-AI-v1.0.5-release.aab
            release/SHA256SUMS.txt
