name: Release APK and AAB

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Git tag to publish when release publishing is enabled"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/platform-tools/adb"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Validate signing configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK and AAB
        id: build
        continue-on-error: true
        run: gradle --no-daemon --stacktrace clean assembleRelease bundleRelease

      - name: Verify APK and AAB
        id: verify
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          jarsigner -verify "$AAB"

      - name: Record build identifier
        id: record
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          printf 'commit=%s\nshort_sha=%s\nversion=1.0.5\n' "$GITHUB_SHA" "${GITHUB_SHA:0:7}" > build-info.txt

      - name: Prepare release files
        id: prepare
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/BQ-Sqwad-AI-v1.0.5-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release/BQ-Sqwad-AI-v1.0.5-release.aab
          cp build-info.txt release/BUILD-INFO.txt
          sha256sum release/* > release/SHA256SUMS.txt

      - name: Upload APK and AAB
        id: upload
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: BQ-Sqwad-AI-v1.0.5-release
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: BQ Sqwad AI v1.0.5
          generate_release_notes: true
          files: |
            release/BQ-Sqwad-AI-v1.0.5-release.apk
            release/BQ-Sqwad-AI-v1.0.5-release.aab
            release/SHA256SUMS.txt

      - name: Report all release-stage failures
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RECORD_OUTCOME: ${{ steps.record.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set +e
          echo "Release pipeline stage results:"
          printf '%-16s %s\n' "build" "$BUILD_OUTCOME"
          printf '%-16s %s\n' "verify" "$VERIFY_OUTCOME"
          printf '%-16s %s\n' "record" "$RECORD_OUTCOME"
          printf '%-16s %s\n' "prepare" "$PREPARE_OUTCOME"
          printf '%-16s %s\n' "upload" "$UPLOAD_OUTCOME"
          failed=0
          for outcome in "$BUILD_OUTCOME" "$VERIFY_OUTCOME" "$RECORD_OUTCOME" "$PREPARE_OUTCOME" "$UPLOAD_OUTCOME"; do
            if [ "$outcome" != "success" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more release stages failed. All independent stages were allowed to report before this final gate."
            exit 1
          fi
          echo "All release stages completed successfully."
