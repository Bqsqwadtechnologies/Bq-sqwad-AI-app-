name: BQ Sqwad AI Release APK AAB

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub release after the APK and AAB build succeeds"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag (for example v1.0.5)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: bq-sqwad-ai-release
  cancel-in-progress: true

jobs:
  release:
    name: Build release APK and AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Validate release signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build release APK and AAB and collect all build errors
        shell: bash
        run: |
          set +e
          : > release-build.log
          echo "=== APK build ===" | tee -a release-build.log
          gradle --no-daemon --stacktrace --continue clean :app:assembleRelease 2>&1 | tee -a release-build.log
          apk_status=${PIPESTATUS[0]}
          echo "APK_GRADLE_EXIT=$apk_status" | tee -a release-build.log

          echo "=== AAB build ===" | tee -a release-build.log
          gradle --no-daemon --stacktrace --continue :app:bundleRelease 2>&1 | tee -a release-build.log
          aab_status=${PIPESTATUS[0]}
          echo "AAB_GRADLE_EXIT=$aab_status" | tee -a release-build.log

          echo "=== Release build summary ===" | tee -a release-build.log
          echo "APK status: $apk_status" | tee -a release-build.log
          echo "AAB status: $aab_status" | tee -a release-build.log
          if [ "$apk_status" -ne 0 ] || [ "$aab_status" -ne 0 ]; then
            echo "One or more release builds failed. Both APK and AAB build stages were attempted so their errors are visible in the same run." | tee -a release-build.log
            exit 1
          fi

      - name: Confirm APK and AAB exist
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/bundle/release/app-release.aab

      - name: Prepare release artifacts
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/BQ-Sqwad-AI-v1.0.5-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release/BQ-Sqwad-AI-v1.0.5-release.aab
          printf 'commit=%s\nversion=1.0.5\n' "$GITHUB_SHA" > release/BUILD-INFO.txt
          sha256sum release/BQ-Sqwad-AI-v1.0.5-release.apk release/BQ-Sqwad-AI-v1.0.5-release.aab > release/SHA256SUMS.txt

      - name: Upload APK, AAB, and build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: BQ-Sqwad-AI-v1.0.5-release
          path: |
            release/
            release-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub release
        if: ${{ inputs.publish_release == true && inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          name: BQ Sqwad AI v1.0.5
          generate_release_notes: true
          files: |
            release/BQ-Sqwad-AI-v1.0.5-release.apk
            release/BQ-Sqwad-AI-v1.0.5-release.aab
            release/SHA256SUMS.txt
