name: BQ Sqwad AI — Build Signed APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bq-sqwad-ai-signed-apk
  cancel-in-progress: true

jobs:
  build-signed-apk:
    name: Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      EXPECTED_SHA1: "6A:62:F9:02:63:82:1B:FF:84:6E:27:2A:E1:CD:56:BA:6A:13:38:D5"

    steps:
      - name: Checkout Main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Set Up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          packages: "platform-tools build-tools;36.0.0"

      - name: Install Android API 36
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

      - name: Restore Signing Keystore
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Verify SHA-1 Fingerprint
        run: |
          set -euo pipefail
          actual="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" |
            awk -F': ' '/SHA1:/{print $2; exit}' | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$EXPECTED_SHA1" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "Signing SHA-1: $actual"
          test "$actual" = "$expected"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Build Signed APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify Signed APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
