name: BQ Sqwad AI — Google Play Release (AAB & APK)

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/release-google-play.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-google-play:
    name: Build Signed Google Play AAB and APK (com.bqsqwad.ai.app)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/app/release-upload.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set Up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Release Keystore
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "${{ secrets.KEYSTORE_BASE64 }}"
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Run Google Play unit tests
        run: gradle :app:testGoogleDebugUnitTest

      - name: Build Signed Google Play Release AAB and APK
        run: gradle :app:assembleGoogleRelease :app:bundleGoogleRelease

      - name: Verify Google Play Outputs and Signatures
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/google/release/app-google-release.apk"
          AAB="app/build/outputs/bundle/googleRelease/app-google-release.aab"
          test -s "$APK"
          test -s "$AAB"

          APKSIGNER="$(find "${ANDROID_HOME:-/opt/android-sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(find "$HOME/.android" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          jarsigner -verify -verbose -certs "$AAB" > /tmp/google-aab-signature-verification.txt 2>&1
          grep -qi "jar verified" /tmp/google-aab-signature-verification.txt
          tail -n 20 /tmp/google-aab-signature-verification.txt

          unzip -t "$APK" >/dev/null
          unzip -t "$AAB" >/dev/null

      - name: Upload Signed Google Play AAB
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-GooglePlay-Signed-AAB
          path: app/build/outputs/bundle/googleRelease/app-google-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Signed Google Play APK
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-GooglePlay-Signed-APK
          path: app/build/outputs/apk/google/release/app-google-release.apk
          if-no-files-found: error
          retention-days: 7
