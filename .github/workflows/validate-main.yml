name: BQ Sqwad AI — Validate and Build Android Releases

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  worker-validation:
    name: Cloudflare Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        run: npm run check
      - name: Run Worker tests
        run: npm test

  android-debug:
    name: Build and test Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Run Android unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Run Android instrumentation tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  android-release:
    name: Build signed release APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Signing material must be stored as GitHub Actions repository secrets.
    # No keystore or passwords are committed to the repository.
    if: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ runner.temp }}/bq-sqwad-release.jks
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Restore signing keystore from repository secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing repository secret KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH" || { echo "::error::Decoded keystore is empty"; exit 1; }
          chmod 600 "$KEYSTORE_PATH"
      - name: Build signed release APK and AAB
        run: gradle --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Verify APK and AAB exist
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v7
        with:
          name: BQ-Sqwad-AI-Signed-Release-APK-and-AAB
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$KEYSTORE_PATH"

  worker-deploy:
    name: Deploy Cloudflare Worker after passing tests
    runs-on: ubuntu-latest
    needs: worker-validation
    if: needs.worker-validation.result == 'success'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Deploy tested Worker
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@latest deploy --config wrangler.jsonc
