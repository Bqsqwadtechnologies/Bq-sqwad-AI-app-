name: BQ Sqwad AI — Validate Main and Worker

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "cloudflare-worker/**"
      - "functions/**"
      - ".github/workflows/validate-main.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-validation:
    name: Cloudflare Worker checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-worker
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Check Worker JavaScript syntax
        run: npm run check
      - name: Run Worker tests
        run: npm test
